<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Intro qui devient la page · module</title>
<script>
  /* Script critique du module intro-vers-l-objet : à placer dans le head, avant les feuilles de style. */
  (function (h) {
    var calme = /[?&]calme\b/.test(location.search);
    try { calme = calme || localStorage.getItem('socle-calme') === '1' || matchMedia('(prefers-reduced-motion: reduce)').matches; } catch (e) {}
    if (calme) h.classList.add('calme'); else h.classList.add('ivo-intro');
    setTimeout(function () { h.classList.remove('ivo-intro'); }, 4000); /* délai de secours */
  })(document.documentElement);
</script>
<link rel="stylesheet" href="../../socle/socle.css?v=1">
<link rel="stylesheet" href="module.css?v=1">
<style>
  :root { --couleur-fond: #141113; --couleur-texte: #f3ebdd; --couleur-accent: #f4c6cf; --couleur-secondaire: #b30e29; }
  .disque { border-radius: 50%; background:
      radial-gradient(circle, var(--couleur-fond) 0 1.4%, transparent 1.6%),
      radial-gradient(circle, var(--couleur-accent) 0 23%, transparent 23.4%),
      repeating-radial-gradient(circle, color-mix(in oklab, var(--couleur-fond) 88%, var(--couleur-texte)) 0 1.4px, var(--couleur-fond) 1.4px 2.8px);
    box-shadow: 0 30px 80px color-mix(in oklab, var(--couleur-fond) 70%, transparent), 0 0 0 1px var(--couleur-ligne); }
  .demo-heros { min-height: var(--ecran-h); display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: clamp(16px, 3vw, 48px); padding: 80px var(--espace) 40px; }
  .demo-heros h1 { font-size: clamp(2.4rem, 6vw, 6rem); }
  .demo-heros h1 { justify-self: end; text-align: right; }
  .demo-mot { font-family: var(--police-titres); font-size: clamp(2.4rem, 6vw, 6rem); line-height: 1.08; color: var(--couleur-accent); }
  .demo-cible { width: min(52svh, 36vw, 560px); aspect-ratio: 1; }
  .demo-bloc { min-height: 60vh; display: grid; align-content: center; gap: 1rem; padding-block: 10vh; }
  @media (max-width: 700px) { .demo-heros { grid-template-columns: minmax(0, 1fr); justify-items: center; text-align: center; } .demo-heros h1 { justify-self: center; text-align: center; } .demo-cible { width: min(72vw, 40svh); } }
</style>
</head>
<body>
<header class="socle-entete" data-entete><span>Démonstration</span><button type="button" data-calme>Mode calme</button></header>
<main>
  <section class="demo-heros">
    <h1>Titre</h1>
    <div class="demo-cible disque" data-iris-centre="disque" role="img" aria-label="Disque de démonstration"></div>
    <p class="demo-mot">de page</p>
  </section>
  <section class="demo-bloc socle-cadre">
    <h2>Titre de la section suivante</h2>
    <p>Rechargez la page : le disque de l'intro glisse jusqu'au disque de l'ouverture, puis l'écran s'ouvre depuis lui.</p>
  </section>
</main>
<div class="ivo" data-module="intro-vers-l-objet" aria-hidden="true">
  <div class="ivo__scene">
    <div class="ivo__objet"><div class="disque"></div></div>
    <p class="ivo__legende">Face A</p>
  </div>
  <p class="ivo__passer">Touchez pour passer</p>
</div>
<script type="module">
  import { init } from './module.js?v=1';
  init(document.querySelector('[data-module="intro-vers-l-objet"]'));
</script>
</body>
</html>
